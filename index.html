<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a rundown sheet of scripts beside the script page; the prompter is a full-bleed stage laid over everything */
:root {
  --paper: #E9EDF2;
  --sheet: #F6F8FA;
  --raised: #FFFFFF;
  --ink: #10141A;
  --ink-2: #485365;
  --ink-3: #78839A;
  --rule: #D3DAE3;
  --rule-strong: #B6C0CD;
  --chroma: #1C44D6;
  --chroma-ink: #FFFFFF;
  --chroma-soft: #DDE5FF;
  --tally: #D2261B;
  --tally-ink: #FFFFFF;
  --tally-soft: #F9DCD8;
  --cue: #985600;
  --ok: #157347;
  --scrim: rgba(9, 12, 18, .46);
  --shadow: 0 1px 2px rgba(16, 20, 26, .07), 0 12px 32px rgba(16, 20, 26, .12);
  --focus: 0 0 0 3px rgba(28, 68, 214, .34);
  --font-display: "Changa", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs: 12px;
  --t-sm: 13px;
  --t-md: 15px;
  --t-lg: 18px;
  --t-xl: 22px;
  --t-2xl: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B0E13;
    --sheet: #11151B;
    --raised: #171C24;
    --ink: #E5EAF1;
    --ink-2: #A6B0C0;
    --ink-3: #737F92;
    --rule: #222933;
    --rule-strong: #343E4B;
    --chroma: #7D98FF;
    --chroma-ink: #0A0D14;
    --chroma-soft: #1B2447;
    --tally: #FF5346;
    --tally-ink: #FFFFFF;
    --tally-soft: #3B1613;
    --cue: #F0B24E;
    --ok: #4CC487;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 36px rgba(0, 0, 0, .5);
    --focus: 0 0 0 3px rgba(125, 152, 255, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B0E13;
  --sheet: #11151B;
  --raised: #171C24;
  --ink: #E5EAF1;
  --ink-2: #A6B0C0;
  --ink-3: #737F92;
  --rule: #222933;
  --rule-strong: #343E4B;
  --chroma: #7D98FF;
  --chroma-ink: #0A0D14;
  --chroma-soft: #1B2447;
  --tally: #FF5346;
  --tally-ink: #FFFFFF;
  --tally-soft: #3B1613;
  --cue: #F0B24E;
  --ok: #4CC487;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 36px rgba(0, 0, 0, .5);
  --focus: 0 0 0 3px rgba(125, 152, 255, .45);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--t-md);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.rtl-flip { transform: none; }
[dir="rtl"] .rtl-flip { transform: scaleX(-1); }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--rule-strong);
  background: var(--raised); color: var(--ink);
  font-size: var(--t-md); font-weight: 500; line-height: 1;
  white-space: nowrap; text-decoration: none;
  transition: background-color .15s, border-color .15s, color .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--chroma); border-color: var(--chroma); color: var(--chroma-ink); }
.btn-primary:hover { border-color: var(--chroma); filter: brightness(1.06); }
.btn-live { background: var(--tally); border-color: var(--tally); color: var(--tally-ink); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--sheet); border-color: var(--rule); }
.btn-block { width: 100%; }
.icon-btn { width: 40px; padding: 0; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 34px; padding: 0 11px;
  border-radius: 999px; border: 1px solid var(--rule);
  background: var(--raised); color: var(--ink-2);
  font-size: var(--t-sm); font-weight: 500; white-space: nowrap; flex: none;
}
.chip .ic { width: 17px; height: 17px; }
.chip:hover { color: var(--ink); border-color: var(--rule-strong); }
.chip[aria-pressed="true"] { background: var(--chroma-soft); border-color: var(--chroma); color: var(--ink); }
.chip-sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--rule); flex: none; }

.field { display: grid; gap: 8px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.field-label { font-size: var(--t-md); color: var(--ink); }
.field-hint { font-size: var(--t-sm); color: var(--ink-3); }
.field-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--t-sm); color: var(--ink-2); min-width: 4ch; text-align: end; }
.select, .text-input {
  min-height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--rule-strong); background: var(--raised); color: var(--ink);
  font-size: 16px; max-width: 100%;
}
.text-input:focus, .select:focus { border-color: var(--chroma); box-shadow: var(--focus); outline: none; }
input[type="range"] { width: 100%; accent-color: var(--chroma); min-height: 28px; }
input[type="color"] {
  width: 44px; height: 32px; padding: 0; border: 1px solid var(--rule-strong);
  border-radius: 8px; background: var(--raised); cursor: pointer;
}
.switch {
  position: relative; width: 46px; height: 28px; flex: none;
  border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--paper);
  transition: background-color .15s, border-color .15s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; inset-inline-start: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--raised); box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  transition: inset-inline-start .15s;
}
.switch[aria-checked="true"] { background: var(--chroma); border-color: var(--chroma); }
.switch[aria-checked="true"]::after { inset-inline-start: 21px; }
.seg {
  display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--paper);
}
.seg button {
  min-height: 32px; min-width: 40px; padding: 0 10px;
  border: 0; border-radius: 7px; background: transparent; color: var(--ink-2);
  font-size: var(--t-sm); font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }

/* ---------- app shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.bars { display: flex; height: 4px; flex: none; }
.bars i { flex: 1; }
.bars i:nth-child(1) { background: #BFBFBF; }
.bars i:nth-child(2) { background: #C3BE00; }
.bars i:nth-child(3) { background: #00BDBD; }
.bars i:nth-child(4) { background: #00B33C; }
.bars i:nth-child(5) { background: #B800B8; }
.bars i:nth-child(6) { background: #C21A10; }
.bars i:nth-child(7) { background: #1A2DC0; }

.topbar {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding-block: 10px; border-bottom: 1px solid var(--rule); background: var(--sheet);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 11px; height: 11px; border-radius: 50%; flex: none;
  background: var(--tally); box-shadow: 0 0 0 3px var(--tally-soft);
}
.brand-name {
  font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1;
  letter-spacing: 0;
}
.sync {
  display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--raised);
  font-size: var(--t-xs); color: var(--ink-2); white-space: nowrap; min-width: 0;
}
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync[data-state="cloud"] i { background: var(--ok); }
.sync[data-state="error"] i { background: var(--tally); }
.sync[data-state="pending"] i { animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.topbar-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 4px; }
.lang-btn { font-weight: 600; font-size: var(--t-sm); min-width: 40px; padding: 0 8px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.pane-lib, .pane-ed { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.pane-lib { background: var(--sheet); }
.pane-ed { background: var(--raised); }

@media (max-width: 899px) {
  .app[data-view="library"] .pane-ed { display: none; }
  .app[data-view="editor"] .pane-lib { display: none; }
  .app[data-view="editor"] .topbar { display: none; }
  .topbar-actions .wide-only { display: none; }
}
@media (min-width: 900px) {
  .main { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); }
  .pane-lib { border-inline-end: 1px solid var(--rule); }
  .ed-back { display: none; }
  .narrow-only { display: none; }
}
.app[data-view="remote"] .main { display: none; }

/* ---------- library (rundown) ---------- */
.lib-tools { display: flex; align-items: center; gap: 8px; padding-block: 14px 8px; flex: none; }
.search { position: relative; flex: 1; min-width: 0; display: block; }
.search .ic { position: absolute; top: 50%; inset-inline-start: 11px; transform: translateY(-50%); color: var(--ink-3); width: 18px; height: 18px; pointer-events: none; }
.search input {
  width: 100%; min-height: 40px; padding-inline: 36px 10px; border-radius: 10px;
  border: 1px solid var(--rule-strong); background: var(--raised); color: var(--ink); font-size: 16px;
}
.search input:focus { border-color: var(--chroma); box-shadow: var(--focus); outline: none; }
.lib-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex: none;
  padding-block: 6px 8px; font-size: var(--t-xs); color: var(--ink-3);
  text-transform: uppercase;
}
.lib-head .num { font-size: var(--t-xs); }
.lib-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--rule); }
.rd-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px;
  padding-block: 12px; border-bottom: 1px solid var(--rule);
  background: transparent; transition: background-color .12s;
}
.rd-row:hover { background: var(--raised); }
.rd-row[aria-current="true"] { background: var(--chroma-soft); }
.rd-cue {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--rule-strong); background: var(--raised); color: var(--ink);
}
.rd-cue .ic { width: 16px; height: 16px; margin-left: 2px; }
.txt-ic { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1; }
.rd-cue:hover { border-color: var(--tally); color: var(--tally); }
.rd-main {
  display: grid; gap: 2px; min-width: 0; padding: 0; border: 0; background: transparent;
  text-align: start; color: inherit;
}
.rd-title {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.3;
}
.rd-tt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-prev { font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-sub { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-dur { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; color: var(--ink); }
.rd-badge {
  flex: none; padding: 1px 7px; border-radius: 6px;
  font-family: var(--font-ui); font-size: 11px; font-weight: 600; line-height: 1.5;
  color: var(--cue); border: 1px solid currentColor;
}
.rd-more { width: 36px; height: 36px; min-height: 36px; color: var(--ink-3); }
.lib-empty { padding-block: 28px 18px; display: grid; gap: 8px; }
.lib-empty h2 { margin: 0; font-family: var(--font-display); font-size: var(--t-xl); font-weight: 600; text-wrap: balance; }
.lib-empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.lib-foot { padding-block: 14px 18px; font-size: var(--t-xs); color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.inst-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; align-items: center;
  padding: 12px 14px; border-radius: 14px; border: 1px solid var(--rule); background: var(--raised);
}
.inst-mark { width: 44px; height: 44px; display: block; }
.inst-mark svg { width: 100%; height: 100%; display: block; }
.inst-txt { display: grid; gap: 2px; min-width: 0; }
.inst-txt strong { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.3; }
.inst-txt p { margin: 0; font-size: var(--t-sm); color: var(--ink-2); }
.inst-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.note-warn { padding: 10px 12px; border-radius: 10px; background: var(--tally-soft); color: var(--ink) !important; }

/* ---------- editor ---------- */
.ed-head {
  display: flex; align-items: center; gap: 8px; flex: none;
  padding-block: 10px; border-bottom: 1px solid var(--rule);
}
.ed-title {
  flex: 1; min-width: 0; min-height: 44px; padding: 4px 8px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: var(--t-xl);
}
.ed-title:hover { border-color: var(--rule); }
.ed-title:focus { border-color: var(--chroma); box-shadow: var(--focus); outline: none; }
.ed-status { font-size: var(--t-xs); color: var(--ink-3); white-space: nowrap; }
.ed-tools {
  display: flex; align-items: center; gap: 6px; flex: none; overflow-x: auto;
  padding-block: 8px; border-bottom: 1px solid var(--rule); scrollbar-width: none;
}
.ed-tools::-webkit-scrollbar { display: none; }
.ed-note {
  flex: none; padding-block: 9px; font-size: var(--t-sm); color: var(--ink);
  background: var(--tally-soft); border-bottom: 1px solid var(--rule);
}
.ed-area { flex: 1; min-height: 0; display: flex; position: relative; }
.ed-text, .ed-preview {
  flex: 1; min-width: 0; width: 100%; border: 0; margin: 0;
  padding-block: 22px 40px;
  padding-left: max(16px, calc((100% - 780px) / 2), env(safe-area-inset-left, 0px));
  padding-right: max(16px, calc((100% - 780px) / 2), env(safe-area-inset-right, 0px));
  background: var(--raised); color: var(--ink);
}
.ed-text {
  resize: none; outline: none; font-size: 18px; line-height: 1.9;
  font-family: var(--font-ui); tab-size: 4;
}
.ed-text::placeholder { color: var(--ink-3); }
.ed-preview { overflow-y: auto; font-family: "Readex Pro", var(--font-ui); font-size: 22px; line-height: 1.7; }
.ed-preview p { margin: 0 0 .8em; }
.ed-preview .sec { font-family: var(--font-display); font-size: var(--t-sm); font-weight: 600; color: var(--ink-3); margin: 1.4em 0 .5em; text-transform: uppercase; }
.ed-preview .cue { font-family: var(--font-ui); font-size: .62em; font-weight: 600; color: var(--cue); border: 1px solid currentColor; border-radius: 6px; padding: .05em .45em; vertical-align: .15em; }
.ed-preview .cue-block { margin: .3em 0 .8em; }
.ed-preview .pause { color: var(--tally); }
.ed-preview .cue .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -.15em; margin-inline-end: .25em; }
.ed-preview .em { font-weight: 700; color: var(--chroma); }
.ed-preview .hl { background: var(--chroma-soft); border-radius: 4px; padding: 0 .15em; }
.ed-preview hr { border: 0; border-top: 2px dashed var(--rule-strong); margin: 1.2em 0; }
.ed-drop {
  position: absolute; inset: 10px; border: 2px dashed var(--chroma); border-radius: 14px;
  background: color-mix(in srgb, var(--chroma-soft) 80%, transparent);
  display: grid; place-items: center; font-weight: 600; color: var(--ink); pointer-events: none;
}
.ed-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; flex: none;
  padding-block: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--rule); background: var(--sheet);
  font-size: var(--t-sm); color: var(--ink-2);
}
.ed-foot .num { font-size: var(--t-sm); }
.ed-foot .grow { flex: 1; }
.stepper { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--rule-strong); border-radius: 10px; background: var(--raised); }
.stepper button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 9px; display: grid; place-items: center; color: var(--ink); }
.stepper button:hover { background: var(--paper); }
.stepper .ic { width: 16px; height: 16px; }
.stepper output { min-width: 3ch; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.stepper .unit { font-size: var(--t-xs); color: var(--ink-3); padding-inline-end: 8px; }

/* ---------- remote control view ---------- */
.remote-view { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; background: var(--paper); }
.rm-head { display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--rule); background: var(--sheet); flex: none; }
.rm-head h1 { margin: 0; font-family: var(--font-display); font-size: var(--t-xl); font-weight: 600; }
.rm-body { width: 100%; max-width: 520px; margin-inline: auto; padding-block: 20px 28px; display: grid; gap: 16px; }
.rm-pair { display: grid; gap: 12px; }
.rm-pair p { margin: 0; color: var(--ink-2); }
.code-input {
  width: 100%; min-height: 64px; text-align: center; letter-spacing: .4em;
  font-family: var(--font-mono); font-size: 32px; font-weight: 600;
  border-radius: 14px; border: 1.5px solid var(--rule-strong); background: var(--raised); color: var(--ink);
}
.code-input:focus { border-color: var(--chroma); box-shadow: var(--focus); outline: none; }
.rm-err { margin: 0; color: var(--tally); font-size: var(--t-sm); }
.rm-card { display: grid; gap: 10px; padding: 16px; border-radius: 16px; background: var(--raised); border: 1px solid var(--rule); }
.rm-card-top { display: flex; align-items: center; gap: 10px; }
.rm-card-top .grow { flex: 1; font-size: var(--t-sm); color: var(--ink-2); }
.rm-script { font-family: var(--font-display); font-size: var(--t-xl); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.rm-bar { height: 6px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.rm-bar i { display: block; height: 100%; width: 0; background: var(--tally); transition: width .3s; }
.rm-nums { display: flex; justify-content: space-between; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--t-sm); color: var(--ink-2); }
#rmWpm { font-family: var(--font-ui); }
.rm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rm-btn {
  min-height: 76px; border-radius: 16px; border: 1px solid var(--rule-strong); background: var(--raised); color: var(--ink);
  display: grid; place-items: center; gap: 4px; padding: 8px; font-size: var(--t-sm); font-weight: 500;
}
.rm-btn .ic { width: 26px; height: 26px; }
.rm-btn:active { transform: scale(.98); }
.rm-btn.play { grid-column: 1 / -1; min-height: 112px; background: var(--ink); color: var(--paper); border-color: var(--ink); font-size: var(--t-md); }
.rm-btn.play .ic { width: 40px; height: 40px; }
.rm-small { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rm-small .rm-btn { min-height: 64px; }
.rm-btn:disabled { opacity: .4; }

.onair {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  min-height: 22px; padding: 0 8px; border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--rule-strong); color: var(--ink-3);
}
.onair.live { background: var(--tally); border-color: var(--tally); color: var(--tally-ink); }

/* ---------- sheets, menus, toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: var(--scrim); }
.scrim.clear { background: transparent; }
.sheet {
  position: fixed; z-index: 81; display: flex; flex-direction: column;
  background: var(--raised); color: var(--ink); box-shadow: var(--shadow);
  max-height: 90%; overflow: hidden;
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding-block: 12px; border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-head h2 { margin: 0; flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--t-lg); text-wrap: balance; }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 16px; align-content: start;
  padding-block: 16px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-body p { margin: 0; color: var(--ink-2); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.sheet-steps { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 6px; color: var(--ink-2); }
@media (max-width: 699px) {
  .sheet { left: 0; right: 0; bottom: 0; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet.drawer { max-height: 62%; }
}
@media (min-width: 700px) {
  .sheet { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(540px, calc(100% - 48px)); border-radius: 18px; max-height: min(86%, 760px); }
  .sheet.drawer { top: 0; bottom: 0; transform: none; width: min(420px, 92%); max-height: none; border-radius: 0; }
  [dir="rtl"] .sheet.drawer { left: 0; right: auto; }
  [dir="ltr"] .sheet.drawer { right: 0; left: auto; }
  .sheet.drawer .sheet-head { padding-top: max(12px, env(safe-area-inset-top, 0px)); }
}
.set-sec { display: grid; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.set-sec:last-child { border-bottom: 0; }
.set-sec h3 { margin: 0; font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  min-width: 64px; min-height: 44px; padding: 4px 10px; border-radius: 10px;
  border: 2px solid var(--rule); font-size: 12px; font-weight: 600;
}
.swatch[aria-pressed="true"] { border-color: var(--chroma); box-shadow: var(--focus); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: var(--t-sm); }
.keys kbd {
  font-family: var(--font-mono); font-size: 12px; padding: 3px 7px; border-radius: 6px;
  border: 1px solid var(--rule-strong); border-bottom-width: 2px; background: var(--sheet); color: var(--ink); white-space: nowrap; direction: ltr; justify-self: start;
}
.markup-list { display: grid; gap: 10px; }
.markup-list div { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 12px; align-items: baseline; }
.markup-list code { font-family: var(--font-mono); font-size: var(--t-sm); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; justify-self: start; unicode-bidi: plaintext; }
.big-code { font-family: var(--font-mono); font-size: 54px; font-weight: 600; letter-spacing: .18em; text-align: center; direction: ltr; padding: 6px 0; }
.status-line { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); font-size: var(--t-sm); }
.status-line i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.status-line.on i { background: var(--ok); }
.rec-video { width: 100%; max-height: 52vh; border-radius: 12px; background: #000; }
.section-list { display: grid; gap: 4px; }
.section-list button {
  display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--raised); text-align: start;
}
.section-list button .num { color: var(--ink-3); font-size: var(--t-sm); margin-inline-start: auto; }

.menu {
  position: fixed; z-index: 85; min-width: 220px; max-width: calc(100% - 24px);
  padding: 6px; border-radius: 14px; border: 1px solid var(--rule);
  background: var(--raised); box-shadow: var(--shadow);
}
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 12px;
  border: 0; border-radius: 9px; background: transparent; color: var(--ink); text-align: start; font-size: var(--t-md);
}
.menu button:hover, .menu button:focus-visible { background: var(--sheet); }
.menu button.danger { color: var(--tally); }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 6px; }

.toasts {
  position: fixed; z-index: 95; left: 0; right: 0;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.prompting .toasts { top: calc(78px + env(safe-area-inset-top, 0px)); bottom: auto; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 14px;
  max-width: min(100%, 480px); padding: 10px 14px; border-radius: 12px;
  background: var(--ink); color: var(--paper); box-shadow: var(--shadow);
  font-size: var(--t-sm);
  animation: toast-in .2s ease-out;
}
.toast button { border: 0; background: transparent; color: var(--paper); font-weight: 700; text-decoration: underline; padding: 4px; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ---------- prompter stage (a single dark broadcast look, independent of the app theme) ---------- */
.stage {
  --stage-bg: #000000; --stage-fg: #FFFFFF; --stage-cue: #FFB347; --stage-em: #FFE26A; --stage-marker: #FF453A;
  --fs: 56px; --lh: 1.5; --fw: 500; --text-w: 88%; --align: start; --marker-y: 33%; --cam-dim: .55; --cam-area: 50%;
  --stage-font: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  position: fixed; inset: 0; z-index: 60; overflow: hidden;
  background: var(--stage-bg); color: var(--stage-fg);
  touch-action: none; user-select: none; -webkit-user-select: none; outline: none;
  container-type: size; container-name: stage;
}
.stage.cam { background: transparent; }
/* the camera preview stays in the phone's own frame, so it is never turned with the text */
.stage-cam { position: fixed; inset: 0; z-index: 59; width: 100%; height: 100%; object-fit: cover; background: #000; }
.stage-cam.selfie { transform: scaleX(-1); }
body.rot90 .stage-cam.selfie, body.rot270 .stage-cam.selfie { transform: scaleY(-1); }
.stage-win { position: absolute; top: 0; left: 0; right: 0; height: 100%; overflow: hidden; }
.stage.cam .stage-win { background: rgba(0, 0, 0, var(--cam-dim)); }
.stage.cam.cam-top .stage-win { height: var(--cam-area); }
.stage.cam .stage-win::after { content: none; }
.stage-flip { position: absolute; inset: 0; }
.stage.fade .stage-flip {
  -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .2) 0%, #000 var(--marker-y), #000 84%, rgba(0, 0, 0, .3) 100%);
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .2) 0%, #000 var(--marker-y), #000 84%, rgba(0, 0, 0, .3) 100%);
}
.stage-track { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
.stage-content {
  position: relative; width: var(--text-w); max-width: calc(100% - 56px); margin: 0 auto;
  font-family: var(--stage-font); font-size: var(--fs); line-height: var(--lh); font-weight: var(--fw);
  text-align: var(--align); overflow-wrap: break-word; padding-bottom: 2px;
}
.stage-content p { margin: 0 0 .55em; }
.stage-content .sec {
  margin: .9em 0 .35em; font-family: var(--font-display); font-size: .46em; line-height: 1.3; font-weight: 600;
  color: var(--stage-cue); opacity: .9; text-transform: uppercase;
}
.stage-content .sec:first-child { margin-top: 0; }
.stage-content .cue {
  display: inline-block; padding: .05em .42em; margin: 0 .1em; border-radius: .3em;
  border: .05em solid currentColor; color: var(--stage-cue);
  font-family: var(--font-ui); font-size: .56em; line-height: 1.35; font-weight: 600; vertical-align: .18em;
}
.stage-content .cue-block { margin: .1em 0 .5em; }
.stage-content .pause { color: var(--stage-marker); }
.stage-content .cue .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -.16em; margin-inline-end: .25em; }
.stage-content .em { color: var(--stage-em); font-weight: 700; }
.stage-content .hl { background: var(--stage-em); color: var(--stage-bg); border-radius: .12em; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.stage-content hr { border: 0; border-top: .06em dashed currentColor; opacity: .35; margin: .8em 18%; }
.stage-content .w { transition: opacity .25s; }
.stage-content .w.read { opacity: .38; }
.stage.caps .stage-content { text-transform: uppercase; }
.stage.no-cues .cue-block, .stage.no-cues .cue:not(.pause) { display: none; }

.marker { position: absolute; left: 0; right: 0; top: var(--marker-y); height: 0; pointer-events: none; }
.stage.no-marker .marker { display: none; }
.mk-l, .mk-r {
  position: absolute; top: 0; transform: translateY(-50%);
  width: clamp(12px, calc(var(--fs) * .42), 40px); height: clamp(18px, calc(var(--fs) * .62), 56px);
  background: var(--stage-marker);
}
.mk-l { left: 6px; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.mk-r { right: 6px; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
.marker.band::before, .marker.line::before { content: ""; position: absolute; left: 0; right: 0; top: 0; transform: translateY(-50%); }
.marker.band::before {
  height: calc(var(--fs) * var(--lh) * 1.04);
  background: color-mix(in srgb, var(--stage-marker) 13%, transparent);
  border-top: 1px solid color-mix(in srgb, var(--stage-marker) 55%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--stage-marker) 55%, transparent);
}
.marker.line::before { height: 2px; background: var(--stage-marker); opacity: .75; }
.marker.band .mk-l, .marker.band .mk-r, .marker.line .mk-l, .marker.line .mk-r { width: 10px; height: 16px; }

.stage-prog { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 4; background: rgba(255, 255, 255, .1); pointer-events: none; }
.stage-prog i { display: block; height: 100%; width: 0; background: var(--stage-marker); }

.hud {
  position: absolute; left: 0; right: 0; z-index: 5; color: #F2F4F8;
  transition: opacity .25s ease, transform .25s ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage.hud-off .hud { opacity: 0; pointer-events: none; }
.stage.hud-off .hud-top { transform: translateY(-10px); }
.stage.hud-off .hud-bottom { transform: translateY(10px); }
.hud-top {
  top: 0; display: flex; align-items: center; gap: 8px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 22px;
  background: linear-gradient(to bottom, rgba(5, 7, 10, .9), rgba(5, 7, 10, .55) 65%, rgba(5, 7, 10, 0));
}
.hud-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.hud-title .t { font-family: var(--font-display); font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .onair { border-color: rgba(255, 255, 255, .28); color: rgba(255, 255, 255, .7); }
.stage .onair.live { background: #E3261B; border-color: #E3261B; color: #FFFFFF; }
.hud-time { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--font-mono); font-variant-numeric: tabular-nums; line-height: 1.15; direction: ltr; }
.hud-time .el { font-size: 17px; font-weight: 600; color: #FFFFFF; }
.hud-time .rm { font-size: 12px; color: rgba(255, 255, 255, .62); }
.hud-bottom {
  bottom: 0; display: grid; gap: 10px; justify-items: center;
  padding-top: 30px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(5, 7, 10, .94), rgba(5, 7, 10, .82) 70%, rgba(5, 7, 10, 0));
}
.hud-tools {
  display: flex; gap: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px;
}
.hud-tools::-webkit-scrollbar { display: none; }
.hb {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-width: 46px; height: 46px; padding: 0 8px; border-radius: 12px; flex: none;
  border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .07); color: #F2F4F8;
  font-size: 11px; font-weight: 500; line-height: 1;
}
.hb .ic { width: 20px; height: 20px; }
.hb:hover { background: rgba(255, 255, 255, .13); }
.hb:focus-visible { box-shadow: 0 0 0 3px rgba(125, 152, 255, .6); }
.hb[aria-pressed="true"] { background: rgba(125, 152, 255, .3); border-color: rgba(125, 152, 255, .75); }
.hb:disabled { opacity: .35; cursor: default; }
.hb.tool { min-width: 64px; height: 54px; }
.hb.tool .lbl { white-space: nowrap; }
.hb.rec { color: #FF6B60; }
.hb.rec[aria-pressed="true"] { background: #E3261B; border-color: #E3261B; color: #FFFFFF; }
.hb .txt-ic { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 20px; height: 20px; }
.hud-speed { display: flex; align-items: center; gap: 10px; width: min(560px, 100%); }
.hud-speed input { flex: 1; min-width: 0; accent-color: #FFFFFF; }
.hud-speed .lbl { font-size: 12px; color: rgba(255, 255, 255, .65); white-space: nowrap; }
.hud-speed .wpm { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 17px; min-width: 3.2ch; text-align: center; }
.hud-transport { display: flex; align-items: center; justify-content: center; gap: 10px; }
.hb.big { width: 52px; height: 52px; border-radius: 50%; }
.hb.big .ic { width: 22px; height: 22px; }
.hb-play {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  border: 0; background: #F4F6FA; color: #0A0D12; box-shadow: 0 6px 20px rgba(0, 0, 0, .4);
}
.hb-play .ic { width: 30px; height: 30px; }
.hb-play:focus-visible { box-shadow: 0 0 0 4px rgba(125, 152, 255, .7); }
.stage.voice .hb-play { background: #E3261B; color: #FFFFFF; }

.stage-note {
  position: absolute; z-index: 6; left: 50%; top: calc(var(--marker-y) + 18%); transform: translateX(-50%);
  max-width: min(92%, 520px); padding: 10px 16px; border-radius: 12px;
  background: rgba(10, 12, 16, .88); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, .16);
  font-family: var(--font-ui); font-size: 15px; text-align: center; pointer-events: none;
}
.rec-badge {
  position: absolute; z-index: 7; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: rgba(10, 12, 16, .82); color: #FFFFFF; font-family: var(--font-mono); font-size: 14px; font-weight: 600; direction: ltr;
  pointer-events: none;
}
.rec-badge i { width: 10px; height: 10px; border-radius: 50%; background: #FF3B30; animation: blink 1s infinite; }
.rec-badge .ri { font-weight: 500; color: rgba(255, 255, 255, .7); }
.rec-badge .ri:empty { display: none; }
.stage:not(.hud-off) .rec-badge { top: calc(70px + env(safe-area-inset-top, 0px)); }

.countdown { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(12, 12, 12, .94); cursor: pointer; }
.leader { position: relative; width: min(64vmin, 360px); aspect-ratio: 1; max-width: 100%; }
.leader-sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(255, 255, 255, .22) var(--a, 0deg), rgba(255, 255, 255, .04) 0); }
.leader svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.leader-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: min(36vmin, 200px); line-height: 1; color: #F4F4F4; }
.countdown .cd-hint { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); color: rgba(255, 255, 255, .55); font-size: 14px; }

.endcard {
  position: absolute; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(420px, calc(100% - 32px)); padding: 22px; border-radius: 18px; text-align: center;
  background: rgba(14, 17, 22, .95); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, .14);
  display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}
.endcard h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.endcard .stats { font-family: var(--font-ui); font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .75); font-size: 15px; }
.endcard .stats .num { color: #FFFFFF; }
.endcard .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.endcard .btn { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); color: #FFFFFF; }
.endcard .btn-live { background: #E3261B; border-color: #E3261B; }

@media (max-width: 599px) {
  .hb.tool { min-width: 58px; }
  .hb.tool .lbl { font-size: 10px; }
  .hb-play { width: 64px; height: 64px; }
  .hb.big { width: 48px; height: 48px; }
  .hud-title .t { font-size: 15px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .hud-bottom { grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 8px 16px; padding-top: 18px; }
  .hud-tools { grid-column: 1 / -1; }
  .hud-speed { width: min(320px, 40vw); }
  .hb-play { width: 56px; height: 56px; }
  .hb.big { width: 44px; height: 44px; }
  .hb.tool { height: 46px; }
  .hb.tool .lbl { display: none; }
}
/* the same compact rules, keyed to the prompter's own box so they also apply when it is turned */
@container stage (max-width: 599px) {
  .hb.tool { min-width: 58px; }
  .hb.tool .lbl { font-size: 10px; }
  .hb-play { width: 64px; height: 64px; }
  .hb.big { width: 48px; height: 48px; }
  .hud-title .t { font-size: 15px; }
}
@container stage (max-height: 520px) and (orientation: landscape) {
  .hud-bottom { grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 8px 16px; padding-top: 18px; }
  .hud-tools { grid-column: 1 / -1; }
  .hud-speed { width: min(320px, 40cqw); }
  .hb-play { width: 56px; height: 56px; }
  .hb.big { width: 44px; height: 44px; }
  .hb.tool { height: 46px; }
  .hb.tool .lbl { display: none; }
}

/* turned prompter: the stage, its sheets and its toasts become one virtual screen rotated a quarter turn */
body.rot90 #stage, body.rot90 #layer, body.rot90 #toasts,
body.rot270 #stage, body.rot270 #layer, body.rot270 #toasts {
  position: fixed; top: 0; left: 0; right: auto; bottom: auto;
  width: var(--app-h, 100vh); height: var(--app-w, 100vw);
  transform-origin: 0 0;
}
body.rot90 #stage, body.rot90 #layer, body.rot90 #toasts { transform: rotate(90deg) translateY(-100%); }
body.rot270 #stage, body.rot270 #layer, body.rot270 #toasts { transform: rotate(-90deg) translateX(-100%); }
body.rot90 #layer, body.rot270 #layer { z-index: 80; pointer-events: none; }
body.rot90 #layer > *, body.rot270 #layer > * { pointer-events: auto; }
body.rot90 #toasts, body.rot270 #toasts { justify-content: flex-start; padding-top: 78px; }
body.rot90 .sheet, body.rot270 .sheet {
  top: 0; bottom: 0; right: 0; left: auto; transform: none;
  width: min(420px, 92%); max-height: none; border-radius: 0; padding-bottom: 0;
}
html[dir="rtl"] body.rot90 .sheet, html[dir="rtl"] body.rot270 .sheet { left: 0; right: auto; }
/* safe areas follow the phone's physical edges, which move when the prompter is turned */
body.rot90 .hud { padding-left: max(16px, env(safe-area-inset-top, 0px)); padding-right: max(16px, env(safe-area-inset-bottom, 0px)); }
body.rot90 .hud-top { padding-top: calc(10px + env(safe-area-inset-right, 0px)); }
body.rot90 .hud-bottom { padding-bottom: calc(12px + env(safe-area-inset-left, 0px)); }
body.rot270 .hud { padding-left: max(16px, env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-top, 0px)); }
body.rot270 .hud-top { padding-top: calc(10px + env(safe-area-inset-left, 0px)); }
body.rot270 .hud-bottom { padding-bottom: calc(12px + env(safe-area-inset-right, 0px)); }
body.rot90 .rec-badge { top: calc(14px + env(safe-area-inset-right, 0px)); }
body.rot270 .rec-badge { top: calc(14px + env(safe-area-inset-left, 0px)); }
body.rot90 .stage:not(.hud-off) .rec-badge, body.rot270 .stage:not(.hud-off) .rec-badge { top: 70px; }

:lang(ar) .onair, :lang(ar) .set-sec h3 { letter-spacing: 0; }
:lang(ar) .onair { font-family: var(--font-ui); font-size: 12px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}

    refs.push(() => { s.value = S[k]; });
    return el('div', { class: 'field' }, el('label', { class: 'field-label', for: 'set-' + k, text: t('set.' + k) }), s);
  };
  const color = (k) => {
    const c = el('input', { type: 'color', value: S[k], id: 'set-' + k });
    c.addEventListener('input', () => { S.preset = 'custom'; setSetting(k, c.value); refs.forEach((f) => f()); });
    refs.push(() => { c.value = S[k]; });
    return el('div', { class: 'field-row' }, el('label', { class: 'field-label', for: 'set-' + k, text: t('set.' + k) }), c);
  };
  const swatches = () => {
    const box = el('div', { class: 'swatches', role: 'group', 'aria-label': t('set.sec.colors') });
    const btns = Object.keys(PRESETS).map((key) => {
      const p = PRESETS[key];
      const b = el('button', { class: 'swatch', type: 'button', 'aria-pressed': String(S.preset === key), style: 'background:' + p.bg + ';color:' + p.fg, text: t('preset.' + key) });
      b.addEventListener('click', () => { Object.assign(S, p, { preset: key }); saveSettings(); applyStage(true); refs.forEach((f) => f()); });
      return [key, b];
    });
    btns.forEach(([, b]) => box.append(b));
    refs.push(() => btns.forEach(([key, b]) => b.setAttribute('aria-pressed', String(S.preset === key))));
    return box;
  };
  const fit = () => {
    const inp = el('input', { class: 'text-input', type: 'text', inputmode: 'numeric', placeholder: '2:30', dir: 'ltr', style: 'width:110px', id: 'set-fit', value: fmtClock((P.wordCount * 60) / P.wpm) });
    const apply = () => {
      const m = inp.value.trim().match(/^(\d{1,3})(?::([0-5]?\d))?$/);
      const secs = m ? (+m[1]) * 60 + (+(m[2] || 0)) : 0;
      if (!secs || !P.wordCount) { toast(t('p.fitBad')); return; }
      setWpm((P.wordCount * 60) / secs, true);
      toast(t('p.speedSet', { w: P.wpm }));
    };
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
    return el('div', { class: 'field' },
      el('label', { class: 'field-label', for: 'set-fit', text: t('set.fit') }),
      el('div', { class: 'field-row', style: 'justify-content:flex-start' }, inp, el('button', { class: 'btn', type: 'button', onclick: apply }, icon('clock'), el('span', { text: t('set.fitApply') }))),
      el('span', { class: 'field-hint', text: t('set.fitHint') }));
  };
  const camInfo = () => {
    const p = el('p', { class: 'field-hint', dir: 'auto' });
    const upd = () => {
      p.textContent = Cam.on ? t('cam.now', { v: '⁦' + Cam.describe() + '⁩' }) + (Cam.recording ? ' — ' + t('cam.lockedRec') : '') : t('cam.applyHint');
    };
    upd();
    refs.push(upd);
    return p;
  };
  const pct = (v) => Math.round(v * 100) + '%';
  const body = el('div', { style: 'display:grid;gap:16px' },
    sec('set.sec.text',
      select('font', FONTS.map((f) => [f.id, f.label[LANG] || f.label.en])),
      range('fontSize', 16, 200, 1, (v) => v + 'px'),
      range('lineHeight', 1.1, 2.4, 0.05, (v) => (+v).toFixed(2)),
      range('textWidth', 40, 100, 1, (v) => v + '%'),
      seg('weight', [[400, '400'], [500, '500'], [600, '600'], [700, '700']]),
      seg('align', [['start', t('align.start')], ['center', t('align.center')]]),
      sw('showCues'), sw('caps')),
    sec('set.sec.orient',
      seg('orient', [['auto', t('orient.auto')], ['portrait', t('orient.portrait')], ['landscape', t('orient.landscape')]], null, rotLock),
      sw('orientFlip', rotLock),
      el('p', { class: 'field-hint', text: t('set.orientHint') })),
    sec('set.sec.colors', swatches(), color('fg'), color('bg'), color('markerColor')),
    sec('set.sec.guide', sw('marker'),
      seg('markerStyle', [['arrows', t('mk.arrows')], ['band', t('mk.band')], ['line', t('mk.line')]]),
      range('markerPos', 0.1, 0.7, 0.01, pct), sw('fade')),
    sec('set.sec.playback', fit(),
      seg('countdown', [[0, '0'], [3, '3'], [5, '5'], [10, '10']]),
      sw('beeps'), sw('autoPause'), sw('tapToggle')),
    sec('set.sec.mirror', sw('mirrorH'), sw('mirrorV')),
    sec('set.sec.camera',
      camInfo(),
      seg('camRes', [['480', '480p'], ['720', '720p'], ['1080', '1080p'], ['2160', '4K']], null, recLock),
      seg('camFps', [[24, '24'], [25, '25'], [30, '30'], [60, '60']], null, recLock),
      seg('camQuality', [['eco', t('q.eco')], ['std', t('q.std')], ['high', t('q.high')]], null, recLock),
      seg('camAspect', [['orig', t('asp.orig')], ['169', t('asp.169')], ['916', t('asp.916')], ['11', t('asp.11')]], null, recLock),
      seg('camFormat', [['auto', t('fmt.auto')], ['mp4', 'MP4'], ['webm', 'WebM']], null, recLock),
      sw('recAudio', recLock),
      seg('camArea', [['top', t('cam.top')], ['full', t('cam.full')]]),
      range('camDim', 0, 0.9, 0.05, pct),
      sw('recAutoStart')),
    sec('set.sec.voice', select('voiceLang', VOICE_LANGS.map(([v, l]) => [v, l || t('vl.auto')])), el('p', { class: 'field-hint', text: t('set.voiceHint') })),
    sec('set.sec.keys', shortcutsList()),
    el('div', { class: 'sheet-actions', style: 'justify-content:flex-start' },
      el('button', { class: 'btn', type: 'button', onclick: () => {
        if (Cam.recording) { toast(t('cam.lockedRec')); return; }
        const keepWpm = S.defaultWpm;
        S = defaultSettings();
        S.defaultWpm = keepWpm;
        saveSettings();
        applyStage(true);
        applyRotation();
        lockOrientation();
        updateOrientBtn();
        Cam.reconfigureSoon();
        updateCamCfgBtn();
        refs.forEach((f) => f());
        toast(t('set.resetDone'));
      } }, icon('restart'), el('span', { text: t('set.reset') }))));
  refs.forEach((f) => f());
  P.setRefs = refs;
  const sh = openSheet({ title: t('p.settings'), body, drawer: true, clear: true, tag: 'stage-settings', onClose: () => { if (P.setRefs === refs) P.setRefs = null; } });
  if (focus) {
    const target = sh.el.querySelector('#sec-' + focus);
    if (target) setTimeout(() => { try { target.scrollIntoView({ block: 'start' }); } catch (e) { /* scroll */ } }, 40);
  }
}

/* ================= app menu & misc sheets ================= */
function syncSheet() {
  const m = Sync.mode;
  openSheet({ title: t('sync.title'), body: el('div', { style: 'display:grid;gap:12px' },
    el('p', { text: t(m === 'cloud' ? 'sync.cloudLong' : m === 'error' ? 'sync.errorLong' : 'sync.localLong') }),
    el('div', { class: 'sheet-actions', style: 'justify-content:flex-start' },
      el('button', { class: 'btn', type: 'button', onclick: backup }, icon('download'), el('span', { text: t('menu.backup') })),
      el('button', { class: 'btn', type: 'button', onclick: () => pickFile('restore') }, icon('upload'), el('span', { text: t('menu.restore') })))) });
}
function appMenu(anchor) {
  openMenu(anchor, [
    canInstallHere() ? { icon: 'box', label: t('menu.install'), fn: doInstall } : null,
    { icon: 'globe', label: t('menu.lang'), fn: () => setLang(LANG === 'ar' ? 'en' : 'ar') },
    { icon: 'keyboard', label: t('menu.shortcuts'), fn: shortcutsSheet },
    '-',
    { icon: 'download', label: t('menu.backup'), fn: backup },
    { icon: 'upload', label: t('menu.restore'), fn: () => pickFile('restore') },
    IN_VIEWER ? { icon: 'file', label: t('menu.appCopy'), fn: saveAppCopy } : null,
    IN_VIEWER ? { icon: 'box', label: t('menu.appZip'), fn: saveAppZip } : null,
    '-',
    { icon: 'cloud', label: t('menu.sync'), fn: syncSheet }
  ]);
}
function applyI18n() {
  const dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = LANG;
  document.documentElement.dir = dir;
  const app = $('app');
  app.lang = LANG;
  app.dir = dir;
  qsa('[data-i18n]').forEach((n) => { n.textContent = t(n.dataset.i18n); });
  qsa('[data-i18n-ph]').forEach((n) => { n.placeholder = t(n.dataset.i18nPh); });
  qsa('[data-i18n-aria]').forEach((n) => {
    const v = t(n.dataset.i18nAria);
    n.setAttribute('aria-label', v);
    if (n.tagName === 'BUTTON') n.title = v;
  });
  $('edText').placeholder = t('ed.textPh');
  const lb = $('btnLang');
  lb.textContent = LANG === 'ar' ? 'EN' : 'ع';
  lb.setAttribute('aria-label', t('lang.other'));
  lb.title = t('lang.other');
  $('btnRemoteMode').title = t('remote.title');
  $('btnRemoteMode').setAttribute('aria-label', t('remote.title'));
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'ar';
  UI.lang = LANG;
  saveUI();
  applyI18n();
  renderSync();
  renderLib();
  if (Ed.id === SAMPLE_ID) Ed.fill(sampleScript());
  else Ed.stats();
  updatePlayUI();
  updateRecUI();
  updateFsBtn();
  updateOrientBtn();
  updateCamCfgBtn();
  Ctl.render();
}

/* ================= wiring ================= */
function bind() {
  els.win = $('stageWin'); els.track = $('track'); els.content = $('content'); els.prog = $('progFill');
  els.elapsed = $('pElapsed'); els.remain = $('pRemain'); els.speed = $('pSpeed'); els.wpm = $('pWpm'); els.recTime = $('recTime');

  $('btnNew').addEventListener('click', newScript);
  $('btnImport').addEventListener('click', () => pickFile('library'));
  $('btnLang').addEventListener('click', () => setLang(LANG === 'ar' ? 'en' : 'ar'));
  $('btnAppMenu').addEventListener('click', (e) => appMenu(e.currentTarget));
  $('btnRemoteMode').addEventListener('click', () => Ctl.open());
  $('sync').addEventListener('click', syncSheet);
  let sTimer = 0;
  $('libSearch').addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(renderLib, 120); });
  $('fileInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; if (f) handleFile(f, pickMode); });

  Ed.ta.addEventListener('input', () => Ed.onInput());
  Ed.title.addEventListener('input', () => Ed.onInput());
  Ed.title.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); Ed.ta.focus(); } });
  Ed.ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); startPrompting(Ed.id, $('edStart')); }
  });
  Ed.ta.addEventListener('blur', () => Ed.flush());
  Ed.title.addEventListener('blur', () => Ed.flush());
  $('edBack').addEventListener('click', backToLibrary);
  $('edStart').addEventListener('click', (e) => startPrompting(Ed.id, e.currentTarget));
  qsa('[data-ins]').forEach((b) => b.addEventListener('click', () => insertMarkup(b.dataset.ins)));
  $('edPreviewBtn').addEventListener('click', () => Ed.togglePreview());
  $('edMore').addEventListener('click', (e) => edMenu(e.currentTarget));
  $('edHelp').addEventListener('click', markupSheet);
  $('edWpmMinus').addEventListener('click', () => Ed.setWpm(Ed.wpm() - 5));
  $('edWpmPlus').addEventListener('click', () => Ed.setWpm(Ed.wpm() + 5));

  const area = $('edArea'), drop = $('edDrop');
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  area.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; dragDepth++; drop.hidden = false; });
  area.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
  area.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation();
    dragDepth = 0; drop.hidden = true;
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f, Ed.id === SAMPLE_ID ? 'library' : 'editor');
  });
  $('paneLib').addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation();
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f, 'library');
  });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => { if (hasFiles(e)) e.preventDefault(); });

  $('rmBack').addEventListener('click', () => Ctl.leave());
  $('rmConnect').addEventListener('click', () => Ctl.connect());
  $('rmCode').addEventListener('input', (e) => { const v = e.target.value.replace(/\D/g, '').slice(0, 4); if (v !== e.target.value) e.target.value = v; });
  $('rmCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); Ctl.connect(); } });
  $('rmDisconnect').addEventListener('click', () => Ctl.disconnect());
  qsa('#rmPad [data-cmd]').forEach((b) => b.addEventListener('click', () => Ctl.send(b.dataset.cmd)));

  $('pExit').addEventListener('click', () => closePrompter(false));
  $('pSettings').addEventListener('click', () => settingsSheet());
  $('pPlay').addEventListener('click', togglePlay);
  $('pBack').addEventListener('click', () => jumpPara(-1));
  $('pFwd').addEventListener('click', () => jumpPara(1));
  $('pSlower').addEventListener('click', () => setWpm(P.wpm - 5));
  $('pFaster').addEventListener('click', () => setWpm(P.wpm + 5));
  els.speed.addEventListener('input', () => setWpm(+els.speed.value));
  $('tVoice').addEventListener('click', () => Voice.toggle());
  $('tCam').addEventListener('click', () => Cam.toggle());
  $('tRec').addEventListener('click', () => { if (Cam.recording) Cam.stopRec(); else Cam.startRec(); });
  $('tFlipCam').addEventListener('click', () => Cam.flip());
  $('tSections').addEventListener('click', sectionsSheet);
  $('tMirror').addEventListener('click', () => setSetting('mirrorH', !S.mirrorH));
  $('tOrient').addEventListener('click', cycleOrient);
  $('tCamCfg').addEventListener('click', () => settingsSheet('camera'));
  $('camVideo').addEventListener('loadedmetadata', () => { updateCamCfgBtn(); refreshSettings(); });
  $('camVideo').addEventListener('resize', () => { updateCamCfgBtn(); refreshSettings(); });
  $('tFontDown').addEventListener('click', () => changeFont(-1));
  $('tFontUp').addEventListener('click', () => changeFont(1));
  $('tRemote').addEventListener('click', () => Host.enable(false));
  $('tFull').addEventListener('click', toggleFullscreen);
  $('endRestart').addEventListener('click', () => restart(true));
  $('endBack').addEventListener('click', () => closePrompter(false));
  $('countdown').addEventListener('click', skipCountdown);
  qsa('.hud').forEach((h) => {
    h.addEventListener('click', (e) => {
      pokeHud();
      const b = e.target.closest('button');
      if (b) setTimeout(() => { if (P.open && !topSheet()) { try { stage.focus({ preventScroll: true }); } catch (err) { /* focus */ } } }, 0);
    });
    h.addEventListener('pointerdown', (e) => e.stopPropagation());
  });

  els.win.addEventListener('pointerdown', onPtrDown);
  els.win.addEventListener('pointermove', onPtrMove);
  els.win.addEventListener('pointerup', onPtrUp);
  els.win.addEventListener('pointercancel', onPtrUp);
  els.win.addEventListener('wheel', onWheel, { passive: false });
  stage.addEventListener('mousemove', () => { if (P.open && P.hudHidden) pokeHud(); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('fullscreenchange', updateFsBtn);
  document.addEventListener('webkitfullscreenchange', updateFsBtn);
  if (window.ResizeObserver) new ResizeObserver(() => { if (P.open) scheduleRelayout(); }).observe(els.win);
  else window.addEventListener('resize', () => { if (P.open) scheduleRelayout(); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { if (P.open) scheduleRelayout(); });
  let wide = isWide();
  window.addEventListener('resize', () => {
    const w = isWide();
    if (w !== wide) { wide = w; renderLib(); }
    setAppSize();
    if (P.open) applyRotation();
  });
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', () => { setAppSize(); if (P.open) applyRotation(); });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (P.open) lockScreen(); }
    else { Ed.flush(); Sync.flushAll(); }
  });
  window.addEventListener('pagehide', () => { Ed.flush(); Sync.flushAll(); });
  window.addEventListener('popstate', () => {
    if (!HIST) return;
    if (ignorePop > 0) { ignorePop--; return; }
    const popped = histStack.pop();
    if (topSheet()) { topSheet().close(); if (popped) pushHistory(popped); return; }
    if (P.open) { closePrompter(true); return; }
    const v = $('app').dataset.view;
    if (v === 'remote') { Ctl.disconnect(); setView('library'); return; }
    if (v === 'editor' && !isWide()) { Ed.flush(); Ed.cleanupEmpty(null); setView('library'); renderLib(); }
  });
}

function boot() {
  LANG = UI.lang === 'en' ? 'en' : 'ar';
  setAppSize();
  Ed.init();
  Lib.load();
  applyI18n();
  bind();
  renderSync();
  const sorted = Lib.sorted();
  const first = UI.lastId === SAMPLE_ID || (UI.lastId && Lib.get(UI.lastId)) ? UI.lastId : sorted[0] ? sorted[0].id : SAMPLE_ID;
  Ed.load(first);
  renderLib();
  setView('library');
  applyStage(false);
  updateRecUI();
  Sync.init();
  if (!IN_VIEWER) {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installEvt = e;
      if ($('app').dataset.view !== 'remote') renderLib();
    });
    window.addEventListener('appinstalled', () => {
      installEvt = null;
      UI.instDismissed = true;
      saveUI();
      renderLib();
      toast(t('inst.done'), { ms: 6000 });
    });
    registerOffline();
    /* home-screen shortcuts: long-press the app icon → New script / Remote */
    let act = null;
    try { act = new URLSearchParams(location.search).get('action'); } catch (e) { act = null; }
    if (act) {
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* keep the address */ }
      if (act === 'new') newScript();
      else if (act === 'remote') Ctl.open();
    }
  }
}
boot();
})();
</script>
</body>
</html>
